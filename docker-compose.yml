# Production stack (docs/ops/deploy.md «What runs where»).

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 20s

# Docker's json-file driver never rotates by default; a chatty worker would fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  DIRECT_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://redis:6379

services:
  caddy:
    image: caddy:2-alpine
    container_name: otmetki-caddy
    restart: always
    logging: *logging
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
    ports:
      # 80 carries the Let's Encrypt challenge, 443 the site.
      - '80:80'
      - '443:443'
      # HTTP/3 (QUIC), which Caddy serves by default.
      - '443:443/udp'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./downloads:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - otmetki

  client:
    build:
      context: .
      dockerfile: apps/web/client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    image: ghcr.io/zilero232/otmetki-client:latest
    container_name: otmetki-client
    restart: always
    logging: *logging
    depends_on:
      - server
    environment:
      # Signs the Next server's API calls so the API rate-limits the visitor.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      # Read per request: `docker compose up -d client` applies a change.
      LESTA_NOTICE: ${LESTA_NOTICE:?}
    expose:
      - '3000'
    networks:
      - otmetki

  server:
    build:
      context: .
      dockerfile: apps/web/server/Dockerfile
    image: ghcr.io/zilero232/otmetki-server:latest
    container_name: otmetki-server
    restart: always
    # Lets in-flight requests and BullMQ jobs finish before Docker sends SIGKILL.
    stop_grace_period: 60s
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      <<: *backend-env
      PORT: '4000'
    expose:
      - '4000'
    volumes:
      # Replays and armor models; lost with the container otherwise.
      - serverdata:/app/apps/web/server/.data
      # releases.json behind GET /modpack/releases/latest.
      - ./downloads:/app/apps/web/server/downloads:ro
    networks:
      - otmetki

  worker:
    image: ghcr.io/zilero232/otmetki-server:latest
    container_name: otmetki-worker
    restart: always
    # Lets active BullMQ jobs finish (worker.close waits for them) before Docker sends SIGKILL.
    stop_grace_period: 60s
    logging: *logging
    command: [bun, src/worker.ts]
    # No API port: the worker's liveness is its heartbeat in the server's /health.
    healthcheck:
      disable: true
    depends_on:
      server:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      <<: *backend-env
    volumes:
      - serverdata:/app/apps/web/server/.data
    networks:
      - otmetki

  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: otmetki-postgres
    restart: always
    logging: *logging
    # Docker's 64 MB /dev/shm is too small for parallel query workers.
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      # Loopback only: Docker's rules bypass UFW; reach it over an ssh tunnel.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/home/postgres/pgdata/data
    networks:
      - otmetki
    healthcheck:
      <<: *healthcheck
      # Over TCP: initdb's socket-only first boot would pass a socket probe.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: otmetki-redis
    restart: always
    logging: *logging
    # BullMQ needs keys to survive eviction; AOF keeps queued jobs across restarts.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    networks:
      - otmetki
    healthcheck:
      <<: *healthcheck
      test: [CMD, redis-cli, ping]

  # Nightly pg_dump, 7 daily / 4 weekly / 6 monthly; copy it off the host.
  backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: otmetki-backup
    restart: always
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_EXTRA_OPTS: -Fc -Z6
      BACKUP_SUFFIX: .dump
      SCHEDULE: '0 4 * * *'
      BACKUP_KEEP_DAYS: '7'
      BACKUP_KEEP_WEEKS: '4'
      BACKUP_KEEP_MONTHS: '6'
    volumes:
      - pgbackups:/backups
    networks:
      - otmetki

networks:
  otmetki:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  pgbackups:
  redisdata:
  serverdata:
