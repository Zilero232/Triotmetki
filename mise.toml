# The toolchain for this repo: `mise install` in the repo root.
# Keep each pin in step with what CI and the Dockerfiles use.

[tools]
# CI installs it from here (.github/actions/setup, jdx/mise-action); the oven/bun images in the Dockerfiles carry the same tag.
bun = "1.3.1"
# The client's runtime image (apps/web/client/Dockerfile: node:22-alpine).
node = "22"
# The modpack's only Python: the game client embeds CPython 2.7.18 64-bit (win64/Tanki.exe), so the game code, its
# tests and the build tooling all run on the same version. mise's own python has no 2.7 builds; the conda backend
# installs the anaconda channel's 2.7.18 (conda-forge stops at 2.7.15 and lacks vc 9 on Windows).
"conda:python" = { version = "2.7.18", channel = "anaconda" }
# The modpack's linter (apps/game/modpack/ruff.toml), the standalone binary: no Python 3 needed.
ruff = "0.16.9"
# The manager's Rust core; tauri/Cargo.toml needs at least rust-version 1.85. CI lints it with rustfmt and clippy.
rust = { version = "stable", components = "rustfmt,clippy" }

[env]
# On Windows the anaconda build keeps python.exe at the root of its install, which the conda backend leaves off PATH.
_.path = ["{{ env.LOCALAPPDATA | default(value='') }}/mise/installs/conda-python/2.7.18"]

[settings]
# The conda backend is experimental in mise.
experimental = true
