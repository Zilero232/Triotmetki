# The toolchain for this repo: `mise install` in the repo root.
# Keep each pin in step with what CI and the Dockerfiles use.

[tools]
# CI installs it from here (.github/actions/setup, jdx/mise-action); the oven/bun images in the Dockerfiles carry the same tag.
bun = "1.3.1"
# The client's runtime image (apps/web/client/Dockerfile: node:22-alpine).
node = "22"
# The modpack's Python 3 tooling: CI runs 3.12 (pyproject requires >=3.10).
# Python 2.7 for release bytecode is a system install: mise has no reliable Python 2.
python = "3.12"
uv = "0.12"
# CI builds the manager on stable; tauri/Cargo.toml needs at least rust-version 1.85.
rust = "stable"
