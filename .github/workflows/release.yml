name: release

# Publishes whichever of the modpack and the manager has an unpublished version to the VPS (docs/ops/deploy.md §4).

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    permissions:
      contents: read

    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      version: ${{ steps.source.outputs.version }}
      games: ${{ steps.source.outputs.games }}
      manager_version: ${{ steps.source.outputs.manager_version }}
      modpack_needed: ${{ steps.source.outputs.modpack_needed }}
      manager_needed: ${{ steps.source.outputs.manager_needed }}

    steps:
      - name: Check the secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          failed=0

          for name in TAURI_SIGNING_PRIVATE_KEY NEXT_PUBLIC_SITE_URL DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PASSWORD DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set (docs/ops/deploy.md §1 «GitHub repository secrets»)"
              failed=1
            fi
          done

          if [[ -n "$NEXT_PUBLIC_SITE_URL" && "$NEXT_PUBLIC_SITE_URL" != https://* ]]; then
            echo "::error::NEXT_PUBLIC_SITE_URL must be https: the manager downloads only over https"
            failed=1
          fi

          exit "$failed"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # 404 means nothing is published yet; any other error stops: a fresh index would drop every release.
      - name: Read the published index
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          url="${SITE_URL%/}/downloads/releases.json"
          mkdir -p dist/index
          status=$(curl -sS --retry 3 -o dist/index/current.json -w '%{http_code}' "$url")

          case "$status" in
            200) ;;
            404) rm -f dist/index/current.json && echo "no index at $url yet" ;;
            *) echo "::error::GET $url answered $status" && exit 1 ;;
          esac

      - name: Compare the versions with the index
        id: source
        run: bun apps/web/server/scripts/modpack-release.ts source --current dist/index/current.json | tee -a "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.source.outputs.modpack_needed != 'true' && steps.source.outputs.manager_needed != 'true'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          MANAGER_VERSION: ${{ steps.source.outputs.manager_version }}
        run: |
          echo "::notice::nothing to release: modpack $VERSION and manager $MANAGER_VERSION are already on the VPS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: index
          path: dist/index/
          if-no-files-found: ignore
          retention-days: 1

  modpack:
    needs: check
    if: needs.check.outputs.modpack_needed == 'true'

    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # node_modules for @resvg/resvg-js (the catalogue previews), ruff, and the Python 2.7 that runs the tooling.
      - uses: ./.github/actions/setup
        with:
          tools: ruff
          python: 'true'

      # Every modpack suite on the game's own Python 2.7, then the linter, before anything is built.
      - name: Test the modpack
        working-directory: apps/game/modpack
        run: |
          python tools/run_tests.py
          ruff check .

      - name: Pin owg_python_compiler
        shell: bash
        run: echo "OWG_COMPILER_VERSION=v1.2.1" >> "$GITHUB_ENV"

      - id: owg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/owg/build
          key: owg-${{ runner.os }}-${{ env.OWG_COMPILER_VERSION }}

      # A C++23 tool without published binaries: build the pinned tag (GCC 14 ships on ubuntu-24.04).
      - name: Build owg_python_compiler
        if: steps.owg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "$OWG_COMPILER_VERSION" --recurse-submodules --shallow-submodules \
            https://gitlab.com/openwg/owg-python-compiler.git "$RUNNER_TEMP/owg"
          cmake -S "$RUNNER_TEMP/owg" -B "$RUNNER_TEMP/owg/build" -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build "$RUNNER_TEMP/owg/build" --parallel

      - name: Build the packages
        shell: bash
        run: |
          owg="$RUNNER_TEMP/owg/build/owg_python_compiler"
          "$owg" version
          python apps/game/modpack/tools/build/build.py --require-pyc --compiler owg --owg-compiler "$owg" --out dist/modpack
          python apps/game/modpack/tools/build/build.py --require-pyc --compiler owg --owg-compiler "$owg" --out dist/modpack --single

      # --strict: every package needs its catalog/catalog.json entry for a release.
      - name: Build the component catalogue
        shell: bash
        working-directory: apps/game/modpack
        run: python tools/build/setupkit --strict --packages ../../../dist/modpack --out ../../../dist/catalog

      - name: Check the version against the catalogue
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          built=$(jq -r .modpackVersion dist/catalog/components.json)

          if [ "$built" != "$VERSION" ]; then
            echo "::error::the build is modpack $built, not $VERSION from apps/game/modpack/package.json"
            exit 1
          fi

          test -f "dist/modpack/single/otmetki.$VERSION.mtmod"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modpack
          path: |
            dist/modpack/
            dist/catalog/
          retention-days: 1

  manager:
    needs: check
    if: needs.check.outputs.manager_needed == 'true'

    permissions:
      contents: read

    environment: production

    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: rust

      # cache-on-failure: a red clippy or test run still keeps the compiled dependencies for the rerun.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/game/manager/tauri -> target
          cache-on-failure: true

      # tauri build downloads NSIS and its plugins into %LOCALAPPDATA%/tauri; the CLI version pins which ones.
      - name: Read the Tauri CLI version
        id: tauri
        shell: bash
        working-directory: apps/game/manager
        run: echo "version=$(bunx tauri --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the Tauri bundler tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ steps.tauri.outputs.version }}

      # The manager's UI and Rust checks, before the installer is built.
      - name: Test the manager
        shell: bash
        env:
          MANIFEST: apps/game/manager/tauri/Cargo.toml
        run: |
          bun --filter @otmetki/manager typecheck
          bunx vitest run --project manager
          cargo fmt --manifest-path "$MANIFEST" --check
          cargo clippy --manifest-path "$MANIFEST" --all-targets --locked -- -D warnings
          cargo test --manifest-path "$MANIFEST" --locked

      - name: Build the installer
        shell: bash
        working-directory: apps/game/manager
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun run build

          shopt -s nullglob
          installers=(tauri/target/release/bundle/nsis/*-setup.exe)

          if [ "${#installers[@]}" -ne 1 ] || [ ! -f "${installers[0]}.sig" ]; then
            echo "::error::expected one NSIS installer with its .sig, found: ${installers[*]:-none}"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manager
          path: |
            apps/game/manager/tauri/target/release/bundle/nsis/*-setup.exe
            apps/game/manager/tauri/target/release/bundle/nsis/*-setup.exe.sig
          retention-days: 1

  publish:
    needs: [check, modpack, manager]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && (needs.check.outputs.modpack_needed == 'true' || needs.check.outputs.manager_needed == 'true')

    permissions:
      contents: read

    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      VERSION: ${{ needs.check.outputs.version }}
      GAMES: ${{ needs.check.outputs.games }}
      MANAGER_VERSION: ${{ needs.check.outputs.manager_version }}
      MODPACK_NEEDED: ${{ needs.check.outputs.modpack_needed }}
      MANAGER_NEEDED: ${{ needs.check.outputs.manager_needed }}
      SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      STAGING: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Every artifact of the run into dist/<name>: index, and modpack / manager when built.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      # notes come from the `## <version>` entry of CHANGELOG.md, changes list every package whose file differs
      # from the newest release in the current index (a missing current.json, before the first release, lists them all).
      - name: Build the modpack release entry and its payload
        if: env.MODPACK_NEEDED == 'true'
        run: |
          bun apps/web/server/scripts/modpack-release.ts prepare \
            --version "$VERSION" --games "$GAMES" \
            --catalog dist/modpack/catalog/components.json --packages dist/modpack/modpack \
            --base-url "${SITE_URL%/}/downloads/modpack/$VERSION" --out dist/release \
            --changelog apps/game/modpack/CHANGELOG.md --current dist/index/current.json

      - name: Sign the payload
        if: env.MODPACK_NEEDED == 'true'
        working-directory: apps/game/manager
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri signer sign "$GITHUB_WORKSPACE/dist/release/release.txt"

      - name: Lay out the downloads folder
        run: |
          publish=dist/publish
          args=(--current dist/index/current.json --out "$publish/releases.json")
          mkdir -p "$publish"

          if [ "$MODPACK_NEEDED" = true ]; then
            mkdir -p "$publish/modpack/$VERSION/catalog"
            cp dist/modpack/modpack/*.mtmod dist/modpack/modpack/single/*.mtmod "$publish/modpack/$VERSION/"
            cp -R dist/modpack/catalog/. "$publish/modpack/$VERSION/catalog/"
            cp "dist/modpack/modpack/single/otmetki.$VERSION.mtmod" "$publish/otmetki.mtmod"
            args+=(--release dist/release/release.json --signature dist/release/release.txt.sig)
          fi

          if [ "$MANAGER_NEEDED" = true ]; then
            file="otmetki-manager_${MANAGER_VERSION}_x64-setup.exe"
            installer=$(find dist/manager -name '*-setup.exe' -print -quit)
            mkdir -p "$publish/manager/$MANAGER_VERSION"
            cp "$installer" "$publish/manager/$MANAGER_VERSION/$file"
            cp "$installer.sig" "$publish/manager/$MANAGER_VERSION/$file.sig"
            cp "$installer" "$publish/otmetki-manager-setup.exe"
            args+=(--manager-version "$MANAGER_VERSION" --manager-signature "$installer.sig")
            args+=(--manager-url "${SITE_URL%/}/downloads/manager/$MANAGER_VERSION/$file")
          fi

          bun apps/web/server/scripts/modpack-release.ts index "${args[@]}"
          find "$publish" -type f | sort

      - name: Upload to the VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: dist/publish
          target: ${{ secrets.DEPLOY_PATH }}/.downloads-staging/${{ env.STAGING }}
          strip_components: 2
          overwrite: true

      # Same-filesystem renames of whatever was staged, releases.json last: the index never names a missing file.
      - name: Publish
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          envs: DEPLOY_PATH,STAGING,VERSION,MANAGER_VERSION
          script: |
            set -euo pipefail

            downloads="$DEPLOY_PATH/downloads"
            staging="$DEPLOY_PATH/.downloads-staging/$STAGING"
            trap 'rm -rf "$staging"' EXIT

            if [ ! -d "$downloads" ]; then
              echo "$downloads does not exist: create it once (mkdir -p $downloads) and redeploy (docs/ops/deploy.md)" >&2
              exit 1
            fi

            chmod -R a+rX "$staging"
            mkdir -p "$downloads/modpack" "$downloads/manager"

            for dir in "modpack/$VERSION" "manager/$MANAGER_VERSION"; do
              [ -d "$staging/$dir" ] || continue
              rm -rf "$downloads/$dir.old"
              if [ -e "$downloads/$dir" ]; then
                mv "$downloads/$dir" "$downloads/$dir.old"
              fi
              mv "$staging/$dir" "$downloads/$dir"
              rm -rf "$downloads/$dir.old"
              echo "published $dir"
            done

            for file in otmetki.mtmod otmetki-manager-setup.exe releases.json; do
              [ -f "$staging/$file" ] || continue
              mv -f "$staging/$file" "$downloads/$file"
            done
