name: deploy

# Checks, builds the images to ghcr and rolls them out on the VPS (docs/ops/deploy.md).

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

env:
  DATABASE_URL: postgresql://placeholder
  DIRECT_URL: postgresql://placeholder

jobs:
  # A tree that already passed checks or e2e skips them on the next deploy.
  gate:
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      checks: ${{ steps.checks.outputs.cache-hit }}
      e2e: ${{ steps.e2e.outputs.cache-hit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - id: checks
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci/passed
          key: checks-passed-${{ steps.tree.outputs.tree }}
          lookup-only: true

      - id: e2e
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci/passed
          key: e2e-passed-${{ steps.tree.outputs.tree }}
          lookup-only: true

  checks:
    needs: gate
    if: needs.gate.outputs.checks != 'true'

    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # The server-db project (bun run test:db) builds a throwaway database here from the
    # Prisma schema and the Timescale layer: the same image as docker-compose.dev.yml.
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: otmetki
          POSTGRES_PASSWORD: otmetki
          POSTGRES_DB: otmetki
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U otmetki -d otmetki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          python: 'true'

      - name: Cache lint and typecheck state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules/.cache
            apps/*/*/node_modules/.cache/tsc
          key: checks-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: checks-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - run: bun run verify

      - run: bun run test

      # Required here: without the database the suites would skip instead of failing.
      - name: Query tests against TimescaleDB
        env:
          TEST_DATABASE_URL: postgresql://otmetki:otmetki@localhost:5434/otmetki
          SERVER_DB_REQUIRED: 'true'
        run: bun run test:db

      - run: bun run test:modpack

      - run: mkdir -p .ci && touch .ci/passed

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci/passed
          key: checks-passed-${{ needs.gate.outputs.tree }}

  # No API here: every page must render its shell or its error state.
  e2e:
    needs: gate
    if: needs.gate.outputs.e2e != 'true'

    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Cache the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: Cache the Next build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/client/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Build the client
        env:
          NEXT_PUBLIC_API_URL: https://api.invalid
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: bun --filter @otmetki/client build

      - name: Serve the client
        env:
          PORT: '3000'
          # Not 127.0.0.1: NextURL makes it localhost and the next-intl rewrite loops.
          HOSTNAME: 0.0.0.0
          INTERNAL_API_TOKEN: e2e-internal-token-no-api-behind-it-000
          LESTA_NOTICE: 'false'
        run: |
          cp -r apps/web/client/.next/static apps/web/client/.next/standalone/apps/web/client/.next/static
          cp -r apps/web/client/public apps/web/client/.next/standalone/apps/web/client/public 2>/dev/null || true

          node apps/web/client/.next/standalone/apps/web/client/server.js &
          echo "$!" > /tmp/web.pid

      - name: Run the smoke tests
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: bun run test:e2e

      - if: always()
        run: kill "$(cat /tmp/web.pid)" || true

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: e2e/.results/
          retention-days: 7

      - run: mkdir -p .ci && touch .ci/passed

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci/passed
          key: e2e-passed-${{ needs.gate.outputs.tree }}

  client:
    needs: [checks, e2e]
    if: ${{ !failure() && !cancelled() }}

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-image
        with:
          image: client
          dockerfile: apps/web/client/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            GIT_COMMIT_SHA=${{ github.sha }}

  server:
    needs: [checks, e2e]
    if: ${{ !failure() && !cancelled() }}

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-image
        with:
          image: server
          dockerfile: apps/web/server/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}

  vps:
    needs: [client, server]
    if: ${{ !failure() && !cancelled() }}

    permissions:
      contents: read

    environment: production

    runs-on: ubuntu-24.04
    # The first run pulls every image and pushes the whole schema.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Paths are kept: compose bind-mounts ./infra/caddy/Caddyfile.
      - name: Copy the compose files and the Caddy config
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: docker-compose.yml,infra/caddy/Caddyfile
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull, sync the schema, restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          command_timeout: 40m
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            docker compose pull client server worker

            # --no-deps below starts nothing, so the database must already be up.
            docker compose up -d --wait postgres redis
            docker compose run --rm --no-deps server bun run db:deploy

            # `up` only reports "exit 1" on a crash: print every service log.
            if ! docker compose up -d; then
              for service in $(docker compose config --services); do
                echo "::group::logs: $service" >&2
                docker compose logs --no-log-prefix --tail 150 "$service" >&2 || true
                echo "::endgroup::" >&2
              done
              exit 1
            fi
            docker image prune -f

            for container in otmetki-server otmetki-client; do
              for attempt in $(seq 1 30); do
                state=$(docker inspect -f '{{.State.Health.Status}}' "$container" 2>/dev/null || echo missing)

                [ "$state" = healthy ] && break

                if [ "$attempt" = 30 ]; then
                  echo "$container never became healthy (last state: $state)" >&2
                  docker compose logs --tail 50 >&2
                  exit 1
                fi

                sleep 5
              done
            done
