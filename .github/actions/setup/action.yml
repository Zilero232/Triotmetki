name: Setup toolchain
description: Bun, the other mise.toml tools a job asks for, and the caches every job in this repo needs.

inputs:
  tools:
    description: Extra mise.toml tools to install next to Bun, space-separated (e.g. "rust" or "ruff").
    required: false
    default: ''
  python:
    description: >-
      "true" adds the modpack's only Python, 2.7.18 (conda:python, the version the game client embeds), with the
      packages of apps/game/modpack/tools/requirements.txt.
    required: false
    default: 'false'

runs:
  using: composite

  steps:
    # Every tool comes from mise.toml, so CI and a local `mise install` run the same versions.
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install_args: bun ${{ inputs.tools }}${{ inputs.python == 'true' && ' conda:python' || '' }}

    # The anaconda build ships no pip, so ensurepip bootstraps the one Python 2.7 bundles.
    - name: Install the modpack tooling packages
      if: inputs.python == 'true'
      shell: bash
      run: |
        python -c 'import sys; assert sys.version_info[:2] == (2, 7), sys.version'
        python -m pip --version || python -m ensurepip
        python -m pip install --disable-pip-version-check --no-warn-script-location -r apps/game/modpack/tools/requirements.txt

    - name: Cache bun packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # postinstall runs prisma generate, which needs DIRECT_URL but never connects.
    - name: Install dependencies
      shell: bash
      env:
        DATABASE_URL: postgresql://placeholder
        DIRECT_URL: postgresql://placeholder
      run: bun install --frozen-lockfile

    # shared/api/generated is gitignored; built offline from the committed OpenAPI.
    - name: Generate the client API
      shell: bash
      run: bun --filter @otmetki/client api:build
