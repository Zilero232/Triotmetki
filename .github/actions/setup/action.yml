name: Setup toolchain
description: Bun, the other mise.toml tools a job asks for, and the caches every job in this repo needs.

inputs:
  tools:
    description: Extra mise.toml tools to install next to Bun, space-separated (e.g. "rust" or "ruff").
    required: false
    default: ''
  python:
    description: >-
      "true" adds the modpack's only Python, 2.7.18 (conda:python, the version the game client embeds), with the
      packages of apps/game/modpack/tools/requirements.txt.
    required: false
    default: 'false'

runs:
  using: composite

  steps:
    # mise's shims would install every other mise.toml tool the moment a shimmed command (cargo, python) runs, through
    # the GitHub API without a token (60 requests an hour per runner IP: the release's manager job hit 403 fetching
    # ruff). A job installs exactly the tools it asks for below; the token goes to mise-action only, never to the
    # job's environment where install scripts could read it.
    - name: Configure mise
      shell: bash
      run: |
        {
          echo "MISE_AUTO_INSTALL=false"
          echo "MISE_EXEC_AUTO_INSTALL=false"
          echo "MISE_NOT_FOUND_AUTO_INSTALL=false"
        } >> "$GITHUB_ENV"

    # Every tool comes from mise.toml, so CI and a local `mise install` run the same versions. mise-action caches its
    # install dir keyed by mise.toml and install_args. Python 2.7's pip keeps no built wheels (no `wheel` package), so
    # the packages installed below are cached inside that dir instead: the key adds the requirements hash and the save
    # waits for the post step, after the pip install.
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install_args: bun ${{ inputs.tools }}${{ inputs.python == 'true' && ' conda:python' || '' }}
        github_token: ${{ github.token }}
        cache_key_prefix: >-
          ${{ inputs.python == 'true' && format('mise-v1-pip-{0}', hashFiles('apps/game/modpack/tools/requirements.txt')) || 'mise-v1' }}
        cache_save_post: ${{ inputs.python }}

    # The anaconda build ships no pip, so ensurepip bootstraps the one Python 2.7 bundles.
    - name: Install the modpack tooling packages
      if: inputs.python == 'true'
      shell: bash
      run: |
        python -c 'import sys; assert sys.version_info[:2] == (2, 7), sys.version'
        python -m pip --version || python -m ensurepip
        python -m pip install --disable-pip-version-check --no-warn-script-location --require-hashes -r apps/game/modpack/tools/requirements.txt

    # bun keeps its cache in ~/.bun/install/cache on Linux and Windows alike (`bun pm cache`).
    - name: Cache bun packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # postinstall runs prisma generate, which needs DIRECT_URL but never connects.
    - name: Install dependencies
      shell: bash
      env:
        DATABASE_URL: postgresql://placeholder
        DIRECT_URL: postgresql://placeholder
      run: bun install --frozen-lockfile

    # shared/api/generated is gitignored; built offline from the committed OpenAPI.
    - name: Generate the client API
      shell: bash
      run: bun --filter @otmetki/client api:build
