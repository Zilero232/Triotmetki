name: Build and push a docker image
description: >
  Log in to ghcr and push one image. Split out so the web and the server build
  in parallel jobs without repeating the login and buildx setup in each.

inputs:
  image:
    description: Image name after the otmetki- prefix, e.g. web or server.
    required: true
  dockerfile:
    description: Path to the Dockerfile, relative to the repository root.
    required: true
  token:
    description: GITHUB_TOKEN, used to push to ghcr.
    required: true
  build-args:
    description: Newline-separated build arguments, if the image takes any.
    required: false
    default: ''

runs:
  using: composite

  steps:
    # ghcr rejects an uppercase path, and an owner may well have one.
    - name: Lowercase the image prefix
      id: owner
      shell: bash
      run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ghcr.io/${{ steps.owner.outputs.value }}/otmetki-${{ inputs.image }}:latest
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha,scope=${{ inputs.image }}
        # A failed cache export (the gha cache API rate-limits) must not fail a build whose image already pushed.
        cache-to: type=gha,mode=max,scope=${{ inputs.image }},ignore-error=true
