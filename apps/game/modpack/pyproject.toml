# Host tooling for the «Мир танков» modpack (tests, lint, build). Not the game runtime: the client runs
# the sources on its own CPython 2.7, and the sources stay 2.7-compatible (tools/tests/test_py27_compat.py).
# requires-python pins the Python 3 used for the tooling only.

[project]
name = "otmetki-modpack"
version = "0.1.0"
description = "Три отметки modpack: the game-client packages (core, companion, features) and their host tooling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "Alexandr Artemev" }]
dependencies = [
  "otmetki-core",
  "otmetki-companion",
  "otmetki-feature-marks-panel",
  "otmetki-feature-session-stats",
  "otmetki-feature-replay-upload",
  "otmetki-feature-damage-log",
  "otmetki-feature-battle-progress",
  "otmetki-feature-team-hp",
  "otmetki-feature-battle-results",
  "otmetki-feature-sixth-sense",
  "otmetki-ui",
  "otmetki-feature-replay-manager",
  "otmetki-feature-hangar-tweaks",
  "otmetki-feature-minimap",
  "otmetki-feature-camera",
  "otmetki-feature-crosshair",
  "otmetki-feature-hangar-info",
  "otmetki-feature-chat-filter",
  "otmetki-feature-auto-resupply",
  "otmetki-feature-notification-filter",
  "otmetki-feature-hangar-cleaner",
  "otmetki-feature-battle-loadout",
  "otmetki-feature-personal-missions",
  "otmetki-feature-streamer-mode",
  "otmetki-feature-gun-arc",
  "otmetki-feature-bush-circle",
  "otmetki-feature-aim-info",
  "otmetki-feature-platoon-points",
  "otmetki-feature-responsive-reticle",
  "otmetki-feature-battle-hotkeys",
  "otmetki-feature-battle-menu",
  "otmetki-feature-hud-layouts",
  "otmetki-feature-comp7-helper",
  "otmetki-feature-event-trackers",
  "otmetki-feature-quick-demount",
  "otmetki-feature-depot-seller",
  "otmetki-feature-auto-reserves",
  "otmetki-feature-crew-xp",
  "otmetki-feature-hangar-space",
  "otmetki-feature-update-notice",
]

[project.urls]
Homepage = "https://triotmetki.ru"
Repository = "https://github.com/Zilero232/Triotmetki"
Issues = "https://github.com/Zilero232/Triotmetki/issues"

# The OpenWG bytecode compiler (owg_python_compiler) is a C++ tool, not on PyPI: see tools/build/compilers.py.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jsonschema>=4",
    "vermin>=1.6",
    "resvg-py>=0.5",
    "pillow>=11",
    "watchdog>=6",
]

[tool.uv]
# Nothing here is installed as a distribution: the members are game packages the tests import through
# tools/testing/_support.py, exactly as the client lays them out (gui.mods.otmetki.*).
package = false

[tool.uv.workspace]
members = ["packages/*", "features/*"]
exclude = ["packages/__pycache__", "features/__pycache__"]

[tool.uv.sources]
otmetki-core = { workspace = true }
otmetki-companion = { workspace = true }
otmetki-feature-marks-panel = { workspace = true }
otmetki-feature-session-stats = { workspace = true }
otmetki-feature-replay-upload = { workspace = true }
otmetki-feature-damage-log = { workspace = true }
otmetki-feature-battle-progress = { workspace = true }
otmetki-feature-team-hp = { workspace = true }
otmetki-feature-battle-results = { workspace = true }
otmetki-feature-sixth-sense = { workspace = true }
otmetki-ui = { workspace = true }
otmetki-feature-replay-manager = { workspace = true }
otmetki-feature-hangar-tweaks = { workspace = true }
otmetki-feature-minimap = { workspace = true }
otmetki-feature-camera = { workspace = true }
otmetki-feature-crosshair = { workspace = true }
otmetki-feature-hangar-info = { workspace = true }
otmetki-feature-chat-filter = { workspace = true }
otmetki-feature-auto-resupply = { workspace = true }
